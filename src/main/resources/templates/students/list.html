<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>
<h1>Students</h1>

<p>
    <a th:href="@{/students/new}">Create Student</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Enrollment Year</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.fullName}"></td>
        <td th:text="${student.email}"></td>
        <td th:text="${student.enrollmentYear}"></td>
        <td>
            <a th:href="@{/students/{id}/edit(id=${student.id})}">Edit</a>
            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="5">No students yet.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
