<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        form.inline { display: inline; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: inline-block; width: 80px; }
    </style>
</head>
<body>
<h1>Users</h1>

<h2 th:text="${editMode} ? 'Edit User' : 'Create User'">Create User</h2>
<form th:action="${editMode} ? @{/users/{id}(id=${formUser.id})} : @{/users}" method="post">
    <input type="hidden" name="_method" th:if="${editMode}" value="PUT"/>
    <input type="hidden" name="id" th:value="${formUser.id}" th:if="${editMode}"/>

    <div class="form-row">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" th:value="${formUser.name}" required/>
    </div>
    <div class="form-row">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" th:value="${formUser.age}"/>
    </div>
    <div class="form-row">
        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="ACTIVE" th:selected="${formUser.status == 'ACTIVE'}">ACTIVE</option>
            <option value="INACTIVE" th:selected="${formUser.status == 'INACTIVE'}">INACTIVE</option>
            <option value="BLOCKED" th:selected="${formUser.status == 'BLOCKED'}">BLOCKED</option>
        </select>
    </div>
    <button type="submit" th:text="${editMode} ? 'Update' : 'Create'">Create</button>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Status</th>
        <th>Status Change</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td><a th:href="@{/users(editId=${user.id})}" th:text="${user.id}">1</a></td>
        <td th:text="${user.name}">Name</td>
        <td th:text="${user.age}">20</td>
        <td th:text="${user.status}">ACTIVE</td>
        <td>
            <form class="inline" th:action="@{/users/{id}(id=${user.id})}" method="post">
                <input type="hidden" name="_method" value="PATCH"/>
                <select name="status">
                    <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                    <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">INACTIVE</option>
                    <option value="BLOCKED" th:selected="${user.status == 'BLOCKED'}">BLOCKED</option>
                </select>
                <button type="submit">Change</button>
            </form>
        </td>
        <td>
            <form class="inline" th:action="@{/users/{id}(id=${user.id})}" method="post">
                <input type="hidden" name="_method" value="DELETE"/>
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
