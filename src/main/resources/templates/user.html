<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users CRUD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }
        .form-row input, .form-row select {
            padding: 6px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .edit-label {
            margin-bottom: 8px;
            color: #444;
        }
    </style>
</head>
<body>
<h1>Users</h1>

<div class="edit-label" id="editLabel" style="display: none;"></div>

<form id="userForm" method="post" th:action="@{/users}">
    <input type="hidden" id="formId" name="id" value="">
    <input type="hidden" id="formMethod" name="_method" value="">

    <div class="form-row">
        <input type="text" id="name" name="name" placeholder="Name">
        <input type="number" id="age" name="age" placeholder="Age">
        <select id="status" name="status">
            <option value="" disabled selected>Status</option>
            <option th:each="statusItem : ${statuses}" th:value="${statusItem}" th:text="${statusItem}"></option>
        </select>
        <button type="submit" id="submitButton">Create</button>
        <button type="button" id="cancelEdit" style="display: none;">Cancel edit</button>
    </div>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="userItem : ${users}">
        <td>
            <a href="#" class="edit-link"
               th:data-id="${userItem.id}"
               th:data-name="${userItem.name}"
               th:data-age="${userItem.age}"
               th:data-status="${userItem.status}"
               th:text="${userItem.id}"></a>
        </td>
        <td th:text="${userItem.name}"></td>
        <td th:text="${userItem.age}"></td>
        <td th:text="${userItem.status}"></td>
        <td>
            <div class="actions">
                <form method="post" th:action="@{/users/{id}(id=${userItem.id})}">
                    <input type="hidden" name="_method" value="PATCH">
                    <select name="status">
                        <option th:each="statusItem : ${statuses}"
                                th:value="${statusItem}"
                                th:text="${statusItem}"
                                th:selected="${statusItem == userItem.status}"></option>
                    </select>
                    <button type="submit">Change</button>
                </form>
                <form method="post" th:action="@{/users/{id}(id=${userItem.id})}">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>

<script>
    const form = document.getElementById('userForm');
    const formId = document.getElementById('formId');
    const formMethod = document.getElementById('formMethod');
    const nameInput = document.getElementById('name');
    const ageInput = document.getElementById('age');
    const statusInput = document.getElementById('status');
    const submitButton = document.getElementById('submitButton');
    const cancelEdit = document.getElementById('cancelEdit');
    const editLabel = document.getElementById('editLabel');

    function setEditMode(id, name, age, status) {
        formId.value = id;
        nameInput.value = name;
        ageInput.value = age;
        statusInput.value = status;
        form.action = `/users/${id}`;
        formMethod.value = 'PUT';
        submitButton.textContent = 'Update';
        editLabel.textContent = `Editing user #${id}`;
        editLabel.style.display = 'block';
        cancelEdit.style.display = 'inline-block';
    }

    function resetForm() {
        formId.value = '';
        nameInput.value = '';
        ageInput.value = '';
        statusInput.value = '';
        form.action = '/users';
        formMethod.value = '';
        submitButton.textContent = 'Create';
        editLabel.style.display = 'none';
        cancelEdit.style.display = 'none';
    }

    document.querySelectorAll('.edit-link').forEach(link => {
        link.addEventListener('click', event => {
            event.preventDefault();
            setEditMode(
                link.dataset.id,
                link.dataset.name,
                link.dataset.age,
                link.dataset.status
            );
        });
    });

    cancelEdit.addEventListener('click', resetForm);
</script>
</body>
</html>
